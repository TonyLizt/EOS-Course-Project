<!doctype html>
<html><head><meta charset="utf-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Widgets/widgets.css">
  <style>html,body,#viewer{width:100%;height:100%;margin:0}#status{position:absolute;z-index:2;background:#fff;padding:8px}</style>
</head><body><div id="status">LOADING</div><div id="viewer"></div><script>
(async () => {
  try {
    const viewer = new Cesium.Viewer('viewer', {baseLayerPicker:false, geocoder:false, timeline:false, animation:false, baseLayer:false});
    viewer.scene.globe.show = false;
    const origin = Cesium.Cartesian3.fromDegrees(0, 0, 700000);
    viewer.entities.add({position:origin, model:{uri:'/assets/satellites/landsat8.glb', minimumPixelSize:180, maximumScale:20, runAnimations:false}});
    viewer.camera.lookAt(origin, new Cesium.HeadingPitchRange(0, -0.35, 80));
    await new Promise((resolve) => setTimeout(resolve, 8000));
    const collections = viewer.scene.primitives._primitives.filter((item) => item && Array.isArray(item._primitives));
    const modelCount = collections.reduce((count, item) => count + item._primitives.length, 0);
    document.getElementById('status').textContent = 'READY models=' + modelCount;
    window.__modelResult = {
      ready:modelCount > 0,
      primitiveCount:viewer.scene.primitives.length,
      modelCount:modelCount,
      primitiveTypes:viewer.scene.primitives._primitives.map((item) => item && item.constructor && item.constructor.name),
      collectionSizes:collections.map((item) => item._primitives.length)
    };
  } catch (error) {
    document.getElementById('status').textContent = 'FAILED ' + error;
    window.__modelResult = {ready:false, error:String(error)};
  }
})();
</script></body></html>
