<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixed payload view smoke</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Cesium.js"></script>
  <script src="/draw/fixed-payload-view.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #111; }
    #shell { position: relative; width: 320px; height: 180px; background: #000; }
    #view { position: absolute; }
  </style>
</head>
<body>
  <div id="shell"><div id="view"></div></div>
  <script>
    window.payloadViewSmoke = { ready: false, error: null };
    try {
      const frustum = FixedPayloadView.opticalFrustum({
        horizontal_full_fov_deg: 45,
        vertical_full_fov_deg: 45,
        fov_interpretation: 'square_full_angle_display_assumption'
      });
      const box = FixedPayloadView.viewportBox(320, 180, frustum.aspect_ratio);
      const container = document.getElementById('view');
      Object.assign(container.style, {
        width: box.width + 'px', height: box.height + 'px',
        left: box.left + 'px', top: box.top + 'px'
      });
      const viewer = new Cesium.Viewer('view', {
        baseLayer: false,
        baseLayerPicker: false,
        geocoder: false,
        animation: false,
        timeline: false,
        shouldAnimate: false,
        useDefaultRenderLoop: false
      });
      viewer.scene.screenSpaceCameraController.enableInputs = false;
      const authoritativeTime = Cesium.JulianDate.fromIso8601('2026-01-01T00:00:05Z');
      viewer.clock.currentTime = Cesium.JulianDate.clone(authoritativeTime);
      viewer.clock.shouldAnimate = false;
      viewer.camera.frustum.aspectRatio = frustum.aspect_ratio;
      viewer.camera.frustum.fov = Cesium.Math.toRadians(45);
      const position = Cesium.Cartesian3.fromDegrees(0, 0, 700000);
      const target = Cesium.Cartesian3.fromDegrees(0, 0, 0);
      const direction = Cesium.Cartesian3.normalize(
        Cesium.Cartesian3.subtract(target, position, new Cesium.Cartesian3()),
        new Cesium.Cartesian3()
      );
      viewer.camera.setView({
        destination: position,
        orientation: { direction: direction, up: Cesium.Cartesian3.UNIT_Z }
      });
      viewer.render();
      window.payloadViewSmoke = {
        ready: true,
        width: container.clientWidth,
        height: container.clientHeight,
        time: Cesium.JulianDate.toIso8601(viewer.clock.currentTime),
        shouldAnimate: viewer.clock.shouldAnimate,
        inputsEnabled: viewer.scene.screenSpaceCameraController.enableInputs,
        aspectRatio: viewer.camera.frustum.aspectRatio,
        fovDegrees: Cesium.Math.toDegrees(viewer.camera.frustum.fov)
      };
    } catch (error) {
      window.payloadViewSmoke = { ready: true, error: String(error && error.stack || error) };
    }
  </script>
</body>
</html>
