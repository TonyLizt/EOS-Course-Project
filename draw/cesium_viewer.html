<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scenario - Satellite Schedule Viewer</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Cesium.js"></script>
  <script src="fixed-payload-state.js"></script>  <script src="fixed-payload-geometry.js"></script>  <script src="fixed-payload-view.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.136/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1020;
      color: #f5f5f5;
    }

    body {
      display: flex;
      flex-direction: row;
    }

    #leftPanel, #rightPanel {
      box-sizing: border-box;
      padding: 10px 12px;
      background: rgba(12, 18, 40, 0.96);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1;
    }

    #leftPanel {
      width: 260px;
    }

    #rightPanel {
      width: 520px;
      border-right: none;
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      overflow-y: auto;
    }

    #cesiumContainer {
      flex: 1 1 auto;
      height: 100%;
    }

    h2 {
      margin: 6px 0 8px 0;
      font-size: 16px;
      font-weight: 600;
      color: #67b2ff;
    }

    .panel-section {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }

    .metric-row span:first-child {
      opacity: 0.75;
    }

    .metric-row span:last-child {
      font-weight: 600;
      color: #ffffff;
    }

    #assignmentList table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    #assignmentList th,
    #assignmentList td {
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      text-align: left;
      white-space: nowrap;
    }

    #assignmentList th {
      position: sticky;
      top: 0;
      background: rgba(20, 30, 60, 1);
      z-index: 2;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #assignmentList tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.02);
    }

    .assignment-row {
      cursor: pointer;
    }

    .assignment-row:hover {
      background: rgba(103, 178, 255, 0.16);
    }

    .assignment-row.active {
      background: rgba(103, 178, 255, 0.26);
      border-left: 2px solid #67b2ff;
    }

    #pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
    }

    #pagination button {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: transparent;
      color: #f5f5f5;
      cursor: pointer;
    }

    #pagination button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #pagination span {
      opacity: 0.8;
    }

    .small-text {
      font-size: 11px;
      opacity: 0.7;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      font-size: 13px;
      margin: 5px 0;
      cursor: pointer;
    }

    .toggle-row input {
      margin-right: 8px;
    }

    .asset-status {
      font-size: 11px;
      line-height: 1.45;
      color: #cbd8ed;
    }

    .asset-status strong {
      color: #ffc857;
    }
    #payloadViewportShell {
      position: relative;
      width: 236px;
      height: 236px;
      margin-top: 8px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    #payloadViewContainer {
      position: absolute;
      background: #000;
    }
    #payloadSatelliteList button, #togglePayloadView {
      width: 100%;
      margin: 3px 0;
      padding: 5px 6px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(25, 40, 75, 0.9);
      color: #f5f5f5;
      text-align: left;
      cursor: pointer;
    }
    #payloadSatelliteList button.active {
      border-color: #67b2ff;
      background: rgba(45, 95, 170, 0.95);
    }
    #payloadViewStatus {
      margin-top: 6px;
      min-height: 30px;
    }

    #openGanttBtn {
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(40, 80, 160, 0.9);
      color: #f5f5f5;
      cursor: pointer;
      transition: background 0.2s;
    }

    #openGanttBtn:hover {
      background: rgba(66, 135, 245, 1);
    }

    #openGanttBtn:disabled {
      opacity: 0.35;
      cursor: default;
      background: rgba(100, 100, 100, 0.5);
    }

    #rightHeaderRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="leftPanel">
    <div class="panel-section">
      <h2>Metrics</h2>
      <div id="metrics">
        <div class="small-text">Loading...</div>
      </div>
    </div>

    <div class="panel-section">
      <h2>Display Controls</h2>
      <label class="toggle-row">
        <input type="checkbox" id="toggleSatTrack" checked />
        Satellite Orbit Tracks
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="toggleSatLabel" checked />
        Satellite Labels
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="toggleSatPoint" checked />
        Satellite Points
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="toggleTargetLabel" checked />
        Ground Target Labels
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="toggleTargetPoint" checked />
        Ground Target Points
      </label>
    </div>

    <div class="panel-section">
      <h2>Simulation Time</h2>
      <div id="currentTime" class="small-text">-</div>
    </div>

    <div class="panel-section">
      <h2>Satellite Appearance</h2>
      <div id="assetStatus" class="asset-status">Point/label fallback active until replay data loads.</div>      <div id="sensorGeometryStatus" class="asset-status">Sensor geometry inactive.</div>
    </div>
    <div class="panel-section">
      <h2>Fixed Payload View</h2>
      <div id="payloadSatelliteList" class="small-text">Replay satellites unavailable.</div>
      <button id="togglePayloadView" type="button">Hide fixed payload view</button>
      <div id="payloadViewportShell"><div id="payloadViewContainer"></div></div>
      <div id="payloadViewStatus" class="asset-status">No satellite selected.</div>
    </div>
  </div>

  <div id="cesiumContainer"></div>

  <div id="rightPanel">
    <div class="panel-section">
      <div id="rightHeaderRow">
        <h2>Observation Intervals</h2>
        <button id="openGanttBtn">Gantt Chart</button>
      </div>
      <div id="assignmentList">
        <div class="small-text">Loading...</div>
      </div>
      <div id="pagination">
        <button id="prevPage" disabled>Previous</button>
        <span id="pageInfo"></span>
        <button id="nextPage" disabled>Next</button>
      </div>
    </div>
  </div>

  <script>
    Cesium.Ion.defaultAccessToken =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2OWQ5ODEzNy0xNGM5LTRlMWEtOTg0MC0yZGI4YTNlZGE5ZDIiLCJpZCI6MzY1OTQ3LCJpYXQiOjE3NjQ2OTE2NDh9.MptWTgPk7UUb6qGi4UI4dtHmzgOHq3UbYEHDeZV0LuI';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayerPicker: false,
      geocoder: false,
      animation: true,
      timeline: true,
      shouldAnimate: true
    });

    function flyToEarthCenter() {
      const center = Cesium.Cartesian3.fromDegrees(0.0, 0.0, 4.0e7);
      viewer.camera.flyTo({
        destination: center,
        orientation: {
          heading: Cesium.Math.toRadians(0.0),
          pitch: -Cesium.Math.PI_OVER_TWO,
          roll: 0.0
        },
        duration: 0.0
      });
    }
    flyToEarthCenter();

    function updateCurrentTimeLabel() {
      const ct = viewer.clock.currentTime;
      const gregorian = Cesium.JulianDate.toGregorianDate(ct);
      const pad = (n) => (n < 10 ? '0' + n : '' + n);
      const text =
        gregorian.year + '-' +
        pad(gregorian.month) + '-' +
        pad(gregorian.day) + ' ' +
        pad(gregorian.hour) + ':' +
        pad(gregorian.minute) + ':' +
        pad(Math.floor(gregorian.second));
      document.getElementById('currentTime').textContent = text;
    }
    viewer.clock.onTick.addEventListener(updateCurrentTimeLabel);

    function getScheduleUrl() {
      const params = new URLSearchParams(window.location.search);
      const url = params.get('schedule');
      if (url && url.trim()) return url.trim();
      return null;
    }

    function schedulerTimeForCesium(value) {
      const text = String(value || '').trim();
      return /(?:Z|[+-]\d{2}:\d{2})$/i.test(text) ? text : text + 'Z';
    }

    async function tryLoadSchedule() {
      const url = getScheduleUrl();
      if (!url) return null;

      try {
        const r = await fetch(url);
        if (!r.ok) {
          console.warn('Schedule file load failed:', r.status, r.statusText);
          return null;
        }
        return await r.json();
      } catch (error) {
        console.warn('Schedule file load failed:', error);
        return null;
      }
    }

    let replayLoadError = null;

    async function tryLoadReplay() {
      const url = new URLSearchParams(window.location.search).get('replay');
      if (!url || !url.trim()) return null;
      try {
        const response = await fetch(url.trim());
        if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
        return await response.json();
      } catch (error) {
        replayLoadError = error;
        document.getElementById('assetStatus').textContent =
          'Replay data unavailable; Cesium point/label fallback remains active. ' + error;
        return null;
      }
    }

    // 第二阶段可按 run_id 传入场景专属 CZML；旧 CLI 没有参数时仍使用原路径。
    const czmlUrl = new URLSearchParams(window.location.search).get('czml') || 'orbit.czml';
    const czmlPromise = Cesium.CzmlDataSource.load(czmlUrl);
    const schedulePromise = tryLoadSchedule();
    const replayPromise = tryLoadReplay();

    Promise.all([czmlPromise, schedulePromise, replayPromise])
      .then(function ([ds, schedule, replay]) {
        viewer.dataSources.add(ds);
        viewer.zoomTo(ds).then(flyToEarthCenter);

        setupMetrics(schedule);
        setupAssignmentsPanel(schedule, ds);
        setupScheduleLink(schedule, ds);
        setupVisibilityControls(ds);
        setupGanttButton(schedule);
        setupBodyModelsAndFixedPayloads(replay, ds);
      })
      .catch(function (error) {
        console.error('Error loading data:', error);
      });

    function setupMetrics(schedule) {
      const metricsDiv = document.getElementById('metrics');

      if (!schedule || !schedule.metrics) {
        metricsDiv.innerHTML = '<div class="small-text">No schedule loaded.</div>';
        return;
      }

      const metrics = schedule.metrics || {};
      const formatFloat = (v, digits = 3) =>
        v == null ? '-' : Number(v).toFixed(digits);

      metricsDiv.innerHTML = ''
        + metricRow('Total Profit (TP)', metrics.TP)
        + metricRow('Completion Rate (TCR)', formatFloat(metrics.TCR, 3))
        + metricRow('Balance Degree (BD)', formatFloat(metrics.BD, 3))
        + metricRow('Timeliness (TM)', formatFloat(metrics.TM, 6))
        + metricRow('Runtime (RT) [s]', formatFloat(metrics.RT, 3))
        + metricRow('Robustness Var (RV)', metrics.RV == null ? '-' : formatFloat(metrics.RV, 3));

      function metricRow(name, value) {
        return (
          '<div class="metric-row">' +
          '<span>' + name + '</span>' +
          '<span>' + value + '</span>' +
          '</div>'
        );
      }
    }

    function setupAssignmentsPanel(schedule, ds) {
      const listDiv = document.getElementById('assignmentList');
      const prevBtn = document.getElementById('prevPage');
      const nextBtn = document.getElementById('nextPage');
      const pageInfo = document.getElementById('pageInfo');

      if (!schedule || !Array.isArray(schedule.assignments)) {
        listDiv.innerHTML = '<div class="small-text">No schedule loaded.</div>';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        pageInfo.textContent = '';
        viewer._scenarioAssignments = [];
        return;
      }

      const rawAssignments = schedule.assignments || [];
      if (!rawAssignments.length) {
        listDiv.innerHTML =
          '<div class="small-text">No observation tasks found.</div>';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        pageInfo.textContent = '';
        viewer._scenarioAssignments = [];
        return;
      }

      const assignments = rawAssignments
        .map((a, idx) => {
          const start = Cesium.JulianDate.fromIso8601(schedulerTimeForCesium(a.sat_start_time));
          const end = Cesium.JulianDate.fromIso8601(schedulerTimeForCesium(a.sat_end_time));
          const durationSec = Cesium.JulianDate.secondsDifference(end, start);
          return {
            index: idx,
            task_id: a.task_id,
            satellite_id: a.satellite_id,
            sat_start_time: a.sat_start_time,
            sat_end_time: a.sat_end_time,
            priority: a.priority,
            start: start,
            end: end,
            durationSec: durationSec
          };
        })
        .sort((a, b) => Cesium.JulianDate.compare(a.start, b.start));

      const pageSize = 12;
      let currentPage = 1;

      function renderPage() {
        const total = assignments.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, total);

        let html = '<table><thead><tr>'
          + '<th>#</th>'
          + '<th>Sat</th>'
          + '<th>Task</th>'
          + '<th>Start Time</th>'
          + '<th>End Time</th>'
          + '<th>Dur(s)</th>'
          + '<th>Pri</th>'
          + '</tr></thead><tbody>';

        for (let i = startIndex; i < endIndex; i++) {
          const a = assignments[i];
          html +=
            '<tr class="assignment-row" data-index="' + a.index + '">'
            + '<td>' + (i + 1) + '</td>'
            + '<td>' + a.satellite_id + '</td>'
            + '<td>' + a.task_id + '</td>'
            + '<td class="small-text">' + a.sat_start_time.replace('T', ' ').split('.')[0] + '</td>'
            + '<td class="small-text">' + a.sat_end_time.replace('T', ' ').split('.')[0] + '</td>'
            + '<td>' + a.durationSec.toFixed(1) + '</td>'
            + '<td>' + a.priority + '</td>'
            + '</tr>';
        }
        html += '</tbody></table>';

        listDiv.innerHTML = html;

        pageInfo.textContent = currentPage + ' / ' + totalPages;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;

        const rows = listDiv.querySelectorAll('.assignment-row');
        rows.forEach((row) => {
          row.addEventListener('click', () => {
            const idx = Number(row.getAttribute('data-index'));
            const a = assignments.find((x) => x.index === idx);
            if (!a) return;

            if (viewer._selectReplaySatellite) viewer._selectReplaySatellite(a.satellite_id);
            viewer.clock.shouldAnimate = false;
            viewer.clock.currentTime = Cesium.JulianDate.clone(a.start, viewer.clock.currentTime);
            viewer.clock.tick();
            viewer.scene.requestRender();

            listDiv.querySelectorAll('.assignment-row').forEach((r) => {
              r.classList.toggle('active', r === row);
            });
          });
        });
      }

      prevBtn.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          renderPage();
        }
      });

      nextBtn.addEventListener('click', () => {
        const totalPages = Math.ceil(assignments.length / pageSize);
        if (currentPage < totalPages) {
          currentPage++;
          renderPage();
        }
      });

      renderPage();
      viewer._scenarioAssignments = assignments;
    }

    function setupScheduleLink(schedule, ds) {
      if (!schedule) return;

      const assignments = viewer._scenarioAssignments || [];
      if (!assignments.length) return;

      function getActiveAssignment(time) {
        for (let i = 0; i < assignments.length; i++) {
          const a = assignments[i];
          if (
            Cesium.JulianDate.lessThanOrEquals(a.start, time) &&
            Cesium.JulianDate.lessThanOrEquals(time, a.end)
          ) {
            return a;
          }
        }
        return null;
      }

      viewer.entities.add({
        id: 'scheduled-link',
        polyline: {
          positions: new Cesium.CallbackProperty(function (time, result) {
            const active = getActiveAssignment(time);
            if (!active) return null;

            const satEntity = ds.entities.getById(active.satellite_id);
            const targetEntity = ds.entities.getById(active.task_id);
            if (!satEntity || !satEntity.position || !targetEntity || !targetEntity.position) {
              return null;
            }
            const satPos = satEntity.position.getValue(time);
            const tgtPos = targetEntity.position.getValue(time);
            if (!satPos || !tgtPos) return null;

            if (!Array.isArray(result)) result = [];
            result.length = 0;
            result.push(satPos, tgtPos);
            return result;
          }, false),
          width: 2,
          material: Cesium.Color.LIME
        }
      });
    }

    function setupVisibilityControls(ds) {
      const satellites = [];
      const targets = [];

      const allEntities = ds.entities.values;
      for (let i = 0; i < allEntities.length; i++) {
        const e = allEntities[i];
        if (Cesium.defined(e.path)) {
          satellites.push(e);
        } else if (Cesium.defined(e.point)) {
          targets.push(e);
        }
      }

      viewer._satelliteEntities = satellites;
      viewer._targetEntities = targets;

      const satTrackCb = document.getElementById('toggleSatTrack');
      const satLabelCb = document.getElementById('toggleSatLabel');
      const satPointCb = document.getElementById('toggleSatPoint');
      const tgtLabelCb = document.getElementById('toggleTargetLabel');
      const tgtPointCb = document.getElementById('toggleTargetPoint');

      function setSatTrackVisible(show) {
        satellites.forEach((s) => { if (s.path) s.path.show = show; });
      }
      function setSatLabelVisible(show) {
        satellites.forEach((s) => { if (s.label) s.label.show = show; });
      }
      function setSatPointVisible(show) {
        satellites.forEach((s) => { if (s.point) s.point.show = show; });
      }
      function setTargetLabelVisible(show) {
        targets.forEach((t) => { if (t.label) t.label.show = show; });
      }
      function setTargetPointVisible(show) {
        targets.forEach((t) => { if (t.point) t.point.show = show; });
      }

      if (satTrackCb) {
        satTrackCb.addEventListener('change', () => setSatTrackVisible(satTrackCb.checked));
      }
      if (satLabelCb) {
        satLabelCb.addEventListener('change', () => setSatLabelVisible(satLabelCb.checked));
      }
      if (satPointCb) {
        satPointCb.addEventListener('change', () => setSatPointVisible(satPointCb.checked));
      }
      if (tgtLabelCb) {
        tgtLabelCb.addEventListener('change', () => setTargetLabelVisible(tgtLabelCb.checked));
      }
      if (tgtPointCb) {
        tgtPointCb.addEventListener('change', () => setTargetPointVisible(tgtPointCb.checked));
      }
    }

    function setupFixedPayloadView(replay, stateAt) {
      if (!window.FixedPayloadView || !(replay.satellites || []).length) return;
      const list = document.getElementById('payloadSatelliteList');
      const shell = document.getElementById('payloadViewportShell');
      const container = document.getElementById('payloadViewContainer');
      const status = document.getElementById('payloadViewStatus');
      const toggle = document.getElementById('togglePayloadView');
      const satelliteById = new Map(replay.satellites.map((item) => [item.id, item]));
      let selectedId = replay.satellites[0].id;
      let visible = true;
      let payloadViewer = null;
      let viewportKey = null;

      const selectedSensor = (state) => {
        const satellite = satelliteById.get(selectedId);
        if (!satellite) return null;
        return satellite.sensors.find((item) => item.sensor_id === (state && state.sensor_id))
          || satellite.sensors[0] || null;
      };
      const ensureViewer = () => {
        if (payloadViewer) return payloadViewer;
        payloadViewer = new Cesium.Viewer('payloadViewContainer', {
          baseLayerPicker: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: false,
          navigationHelpButton: false,
          animation: false,
          timeline: false,
          fullscreenButton: false,
          infoBox: false,
          selectionIndicator: false,
          shouldAnimate: false,
          useDefaultRenderLoop: false,
          requestRenderMode: true
        });
        payloadViewer.clock.shouldAnimate = false;
        payloadViewer.scene.screenSpaceCameraController.enableInputs = false;
        payloadViewer.scene.globe.depthTestAgainstTerrain = false;
        return payloadViewer;
      };
      const applyViewport = (frustum) => {
        const box = FixedPayloadView.viewportBox(
          shell.clientWidth, shell.clientHeight, frustum.aspect_ratio
        );
        const key = [box.width, box.height, frustum.horizontal_full_fov_deg,
          frustum.vertical_full_fov_deg].join(':');
        if (key === viewportKey) return ensureViewer();
        viewportKey = key;
        container.style.width = box.width + 'px';
        container.style.height = box.height + 'px';
        container.style.left = box.left + 'px';
        container.style.top = box.top + 'px';
        const secondary = ensureViewer();
        secondary.resize();
        secondary.camera.frustum.aspectRatio = frustum.aspect_ratio;
        secondary.camera.frustum.fov = Cesium.Math.toRadians(
          frustum.aspect_ratio > 1
            ? frustum.horizontal_full_fov_deg : frustum.vertical_full_fov_deg
        );
        secondary.camera.frustum.near = 10;
        secondary.camera.frustum.far = 50000000;
        return secondary;
      };
      const renderSelected = (time) => {
        if (!visible) return;
        const state = stateAt(selectedId, time);
        const pose = FixedPayloadView.cameraPose(state);
        const sensor = selectedSensor(state);
        status.textContent = FixedPayloadView.statusText(selectedId, pose);
        if (!pose || !sensor) return;
        const frustum = FixedPayloadView.opticalFrustum(sensor);
        const secondary = applyViewport(frustum);
        secondary.clock.currentTime = Cesium.JulianDate.clone(time, secondary.clock.currentTime);
        secondary.camera.setView({
          destination: Cesium.Cartesian3.fromArray(pose.position_ecef_m),
          orientation: {
            direction: Cesium.Cartesian3.fromArray(pose.direction_ecef),
            up: Cesium.Cartesian3.fromArray(pose.up_ecef)
          }
        });
        secondary.scene.requestRender();
        secondary.render();
      };
      const selectSatellite = (satelliteId) => {
        if (!satelliteById.has(satelliteId)) return false;
        selectedId = satelliteId;
        list.querySelectorAll('button').forEach((button) => {
          button.classList.toggle('active', button.dataset.satelliteId === selectedId);
        });
        renderSelected(viewer.clock.currentTime);
        return true;
      };
      viewer._selectReplaySatellite = selectSatellite;

      list.innerHTML = '';
      replay.satellites.forEach((satellite) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.satelliteId = satellite.id;
        button.textContent = satellite.id + ' [' + (satellite.maneuverability_type || 'unknown') + ']';
        button.addEventListener('click', () => selectSatellite(satellite.id));
        list.appendChild(button);
      });
      toggle.addEventListener('click', () => {
        visible = !visible;
        shell.style.display = visible ? 'block' : 'none';
        toggle.textContent = visible ? 'Hide fixed payload view' : 'Show fixed payload view';
        if (visible) renderSelected(viewer.clock.currentTime);
      });
      viewer.screenSpaceEventHandler.setInputAction((movement) => {
        const picked = viewer.scene.pick(movement.position);
        const entity = picked && picked.id;
        const id = entity && (entity.id || entity._id);
        if (typeof id === 'string') selectSatellite(id);
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
      viewer.clock.onTick.addEventListener((clock) => renderSelected(clock.currentTime));
      window.addEventListener('resize', () => {
        if (visible) renderSelected(viewer.clock.currentTime);
      });
      window.addEventListener('beforeunload', () => {
        if (payloadViewer && !payloadViewer.isDestroyed()) payloadViewer.destroy();
      }, { once: true });
      selectSatellite(selectedId);
    }

    function setupSensorGeometry(satellite, stateAt) {
      if (!window.FixedPayloadGeometry || !window.FixedPayloadState) return 0;
      const samplesPerEdge = 4;
      const statusMap = viewer._sensorGeometryStatuses || new Map();
      viewer._sensorGeometryStatuses = statusMap;
      if (!viewer._sensorGeometryStatusListener) {
        viewer._sensorGeometryStatusListener = true;
        viewer.clock.onTick.addEventListener(function () {
          const values = Array.from(statusMap.values());
          const active = values.filter((value) => value !== 'IDLE');
          const complete = active.filter((value) => value === 'COMPLETE').length;
          const partial = active.filter((value) => value === 'PARTIAL_HORIZON').length;
          const missed = active.filter((value) =>
            value === 'NO_BOUNDARY_INTERSECTION' || value === 'CENTER_MISS'
          ).length;
          document.getElementById('sensorGeometryStatus').textContent = active.length
            ? 'WGS84 sensor geometry: ' + complete + ' complete, ' + partial
              + ' partial horizon, ' + missed + ' no intersection.'
            : 'Sensor frustums hidden: no satellite is slewing or observing at this time.';
        });
      }

      let cachedKey = null;
      let cachedGeometry = null;
      const cartesianArray = (value) => [value.x, value.y, value.z];
      const intersectWgs84 = (originArray, directionArray) => {
        const origin = Cesium.Cartesian3.fromArray(originArray);
        const direction = Cesium.Cartesian3.normalize(
          Cesium.Cartesian3.fromArray(directionArray), new Cesium.Cartesian3()
        );
        const ray = new Cesium.Ray(origin, direction);
        const interval = Cesium.IntersectionTests.rayEllipsoid(ray, Cesium.Ellipsoid.WGS84);
        if (!interval) return null;
        const distances = [interval.start, interval.stop]
          .filter((value) => Number.isFinite(value) && value >= 0)
          .sort((left, right) => left - right);
        if (!distances.length) return null;
        return cartesianArray(Cesium.Ray.getPoint(ray, distances[0], new Cesium.Cartesian3()));
      };
      const geometryAt = (time) => {
        const key = Cesium.JulianDate.toIso8601(time, 3);
        if (key === cachedKey) return cachedGeometry;
        const state = stateAt(satellite.id, time);
        const style = FixedPayloadGeometry.phaseStyle(state && state.phase);
        if (!state || !style.visible) {
          cachedKey = key;
          cachedGeometry = { visible: false, style: style, status: 'IDLE' };
          statusMap.set(satellite.id, 'IDLE');
          return cachedGeometry;
        }
        const sensor = satellite.sensors.find((item) => item.sensor_id === state.sensor_id)
          || satellite.sensors[0];
        try {
          const frame = FixedPayloadGeometry.sensorFrame(
            state, sensor, FixedPayloadState.rotate, samplesPerEdge
          );
          const intersections = FixedPayloadGeometry.intersectFrame(frame, intersectWgs84);
          cachedKey = key;
          cachedGeometry = {
            visible: true, style: style, intersections: intersections, status: intersections.status
          };
          statusMap.set(satellite.id, intersections.status);
          return cachedGeometry;
        } catch (error) {
          console.warn('Sensor geometry unavailable for ' + satellite.id, error);
          cachedKey = key;
          cachedGeometry = { visible: false, style: style, status: 'GEOMETRY_MISSING' };
          statusMap.set(satellite.id, 'GEOMETRY_MISSING');
          return cachedGeometry;
        }
      };
      const colorAt = (time, alphaScale) => {
        const rgba = geometryAt(time).style.rgba;
        return new Cesium.Color(rgba[0], rgba[1], rgba[2], rgba[3] * alphaScale);
      };
      const liftForDisplay = (array) => {
        const point = Cesium.Cartesian3.fromArray(array);
        const normal = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(
          point, new Cesium.Cartesian3()
        );
        return Cesium.Cartesian3.add(
          point,
          Cesium.Cartesian3.multiplyByScalar(normal, 20, new Cesium.Cartesian3()),
          new Cesium.Cartesian3()
        );
      };

      viewer.entities.add({
        id: 'fixed-payload-center-' + satellite.id,
        name: satellite.id + ' sensor center ray and WGS84 ellipsoid hit',
        polyline: {
          show: new Cesium.CallbackProperty((time) => {
            const value = geometryAt(time);
            return Boolean(value.visible && value.intersections.center_hit_ecef_m);
          }, false),
          positions: new Cesium.CallbackProperty((time) => {
            const value = geometryAt(time);
            if (!value.visible || !value.intersections.center_hit_ecef_m) return undefined;
            return [
              Cesium.Cartesian3.fromArray(value.intersections.origin_ecef_m),
              Cesium.Cartesian3.fromArray(value.intersections.center_hit_ecef_m)
            ];
          }, false),
          width: 2,
          material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(
            (time) => colorAt(time, 1.0), false
          ))
        }
      });
      viewer.entities.add({
        id: 'fixed-payload-center-hit-' + satellite.id,
        name: satellite.id + ' WGS84 center intersection; target altitude is separate',
        position: new Cesium.CallbackProperty((time) => {
          const value = geometryAt(time);
          return value.visible && value.intersections.center_hit_ecef_m
            ? liftForDisplay(value.intersections.center_hit_ecef_m) : undefined;
        }, false),
        point: {
          show: new Cesium.CallbackProperty((time) => {
            const value = geometryAt(time);
            return Boolean(value.visible && value.intersections.center_hit_ecef_m);
          }, false),
          pixelSize: 7,
          color: new Cesium.CallbackProperty((time) => colorAt(time, 2.5), false),
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 1
        }
      });

      const rayCount = samplesPerEdge * 4;
      for (let index = 0; index < rayCount; index += 1) {
        viewer.entities.add({
          id: 'fixed-payload-boundary-' + satellite.id + '-' + index,
          polyline: {
            show: new Cesium.CallbackProperty((time) => {
              const value = geometryAt(time);
              return Boolean(value.visible && value.intersections.frustum_boundary_ecef_m[index]);
            }, false),
            positions: new Cesium.CallbackProperty((time) => {
              const value = geometryAt(time);
              const endpoint = value.visible && value.intersections.frustum_boundary_ecef_m[index];
              if (!endpoint) return undefined;
              return [
                Cesium.Cartesian3.fromArray(value.intersections.origin_ecef_m),
                Cesium.Cartesian3.fromArray(endpoint)
              ];
            }, false),
            width: 2,
            arcType: Cesium.ArcType.NONE,
            material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(
              (time) => colorAt(time, 2.2), false
            ))
          }
        });
        viewer.entities.add({
          id: 'fixed-payload-side-' + satellite.id + '-' + index,
          polygon: {
            show: new Cesium.CallbackProperty((time) => {
              const value = geometryAt(time);
              return Boolean(value.visible && value.intersections.frustum_boundary_ecef_m);
            }, false),
            hierarchy: new Cesium.CallbackProperty((time) => {
              const value = geometryAt(time);
              const boundary = value.visible && value.intersections.frustum_boundary_ecef_m;
              if (!boundary) return undefined;
              return new Cesium.PolygonHierarchy([
                Cesium.Cartesian3.fromArray(value.intersections.origin_ecef_m),
                Cesium.Cartesian3.fromArray(boundary[index]),
                Cesium.Cartesian3.fromArray(boundary[(index + 1) % boundary.length])
              ]);
            }, false),
            perPositionHeight: true,
            arcType: Cesium.ArcType.NONE,
            material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(
              (time) => colorAt(time, 0.78), false
            )),
            outline: false
          }
        });
      }
      viewer.entities.add({
        id: 'fixed-payload-frustum-cap-' + satellite.id,
        name: satellite.id + ' fixed payload translucent FOV envelope',
        polygon: {
          show: new Cesium.CallbackProperty((time) => {
            const value = geometryAt(time);
            return Boolean(value.visible && value.intersections.frustum_boundary_ecef_m);
          }, false),
          hierarchy: new Cesium.CallbackProperty((time) => {
            const value = geometryAt(time);
            const boundary = value.visible && value.intersections.frustum_boundary_ecef_m;
            return boundary
              ? new Cesium.PolygonHierarchy(
                boundary.map((point) => Cesium.Cartesian3.fromArray(point))
              ) : undefined;
          }, false),
          perPositionHeight: true,
          arcType: Cesium.ArcType.NONE,
          material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(
            (time) => colorAt(time, 0.5), false
          )),
          outline: true,
          outlineColor: Cesium.Color.WHITE.withAlpha(0.8)
        }
      });
      viewer.entities.add({
        id: 'fixed-payload-footprint-' + satellite.id,
        name: satellite.id + ' WGS84 ellipsoid footprint',
        polygon: {
          show: new Cesium.CallbackProperty((time) => {
            const value = geometryAt(time);
            return Boolean(value.visible && value.intersections.coverage_ecef_m);
          }, false),
          hierarchy: new Cesium.CallbackProperty((time) => {
            const value = geometryAt(time);
            const coverage = value.visible && value.intersections.coverage_ecef_m;
            return coverage
              ? new Cesium.PolygonHierarchy(coverage.map(liftForDisplay)) : undefined;
          }, false),
          perPositionHeight: true,
          material: new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(
            (time) => colorAt(time, 0.7), false
          )),
          outline: true,
          outlineColor: Cesium.Color.WHITE.withAlpha(0.65)
        }
      });
      return rayCount;
    }

    function setupBodyModelsAndFixedPayloads(replay, ds) {
      const status = document.getElementById('assetStatus');
      if (!replay || !window.FixedPayloadState) {
        status.textContent = replayLoadError
          ? 'Replay data unavailable; Cesium point/label fallback remains active. ' + replayLoadError
          : 'No replay sidecar; Cesium point/label fallback is active.';
        return;
      }
      const targets = new Map();
      (replay.missions || []).forEach((mission) => {
        const location = mission.target_location;
        targets.set(mission.id, Cesium.Cartesian3.fromDegrees(
          Number(location.longitude), Number(location.latitude), Number(location.altitude_km || 0) * 1000
        ));
      });
      const stateCache = new Map();
      const toArray = (value) => value ? [value.x, value.y, value.z] : null;
      const positionAt = (satelliteId, isoTime) => {
        const entity = ds.entities.getById(satelliteId);
        if (!entity || !entity.position) return null;
        const time = typeof isoTime === 'string' ? Cesium.JulianDate.fromIso8601(isoTime) : isoTime;
        return toArray(entity.position.getValue(time));
      };
      const targetPosition = (taskId) => toArray(targets.get(taskId));
      const stateAt = (satelliteId, time) => {
        const key = satelliteId + ':' + Cesium.JulianDate.toIso8601(time, 3);
        if (stateCache.has(key)) return stateCache.get(key);
        try {
          const value = FixedPayloadState.evaluateSatelliteState(
            replay, satelliteId, Cesium.JulianDate.toIso8601(time), positionAt, targetPosition
          );
          stateCache.clear();
          stateCache.set(key, value);
          return value;
        } catch (error) {
          console.warn('Fixed payload state unavailable for ' + satelliteId, error);
          return null;
        }
      };
      let modelCount = 0;
      let markerCount = 0;
      let frustumRayCount = 0;
      (replay.satellites || []).forEach((satellite) => {
        const entity = ds.entities.getById(satellite.id);
        if (!entity || !entity.position) return;
        const model = satellite.model;
        if (model) {
          const modelAxis = model.model_to_body_quaternion_xyzw;
          entity.orientation = new Cesium.CallbackProperty((time, result) => {
            const state = stateAt(satellite.id, time);
            if (!state || !state.body_to_ecef_quaternion_xyzw) return undefined;
            const value = FixedPayloadState.multiply(state.body_to_ecef_quaternion_xyzw, modelAxis);
            if (!result) return new Cesium.Quaternion(value[0], value[1], value[2], value[3]);
            result.x = value[0];
            result.y = value[1];
            result.z = value[2];
            result.w = value[3];
            return result;
          }, false);
          entity.model = new Cesium.ModelGraphics({
            uri: model.uri,
            minimumPixelSize: model.minimum_pixel_size,
            maximumScale: model.maximum_scale,
            runAnimations: false,
            clampAnimations: true,
            shadows: Cesium.ShadowMode.DISABLED
          });
          modelCount += 1;
        }
        viewer.entities.add({
          id: 'fixed-payload-marker-' + satellite.id,
          name: satellite.id + ' fixed payload -Z axis',
          polyline: {
            positions: new Cesium.CallbackProperty((time, result) => {
              const state = stateAt(satellite.id, time);
              if (!state || !state.position_ecef_m || !state.direction_ecef) return undefined;
              const origin = Cesium.Cartesian3.fromArray(state.position_ecef_m);
              const direction = Cesium.Cartesian3.fromArray(state.direction_ecef);
              const endpoint = Cesium.Cartesian3.add(
                origin, Cesium.Cartesian3.multiplyByScalar(direction, 80000, new Cesium.Cartesian3()),
                new Cesium.Cartesian3()
              );
              if (!Array.isArray(result)) result = [];
              result.length = 2;
              result[0] = Cesium.Cartesian3.clone(origin, result[0]);
              result[1] = Cesium.Cartesian3.clone(endpoint, result[1]);
              return result;
            }, false),
            width: 2,
            material: Cesium.Color.ORANGE
          }
        });
        markerCount += 1;
        frustumRayCount += setupSensorGeometry(satellite, stateAt);
      });
      status.innerHTML = '<strong>Landsat 8 illustrative appearance</strong><br>'
        + modelCount + ' body model(s), ' + markerCount + ' fixed -Z payload marker(s). '
        + frustumRayCount + ' sampled FOV boundary ray(s) with translucent side faces. Original satellite IDs remain unchanged; '
        + 'point/label geometry is retained as the load fallback. '
        + 'FOV is a square full-angle display assumption only.';
      setupFixedPayloadView(replay, stateAt);
    }

    function setupGanttButton(schedule) {
      const btn = document.getElementById('openGanttBtn');
      if (!btn) return;

      const scheduleUrl = getScheduleUrl();
      if (!schedule || !scheduleUrl) {
        btn.disabled = true;
        return;
      }

      btn.disabled = false;
      btn.addEventListener('click', () => {
        const ganttBase = new URLSearchParams(window.location.search).get('gantt') || 'gantt_viewer.html';
        const target = ganttBase + '?schedule=' + encodeURIComponent(scheduleUrl);
        window.open(target, '_blank');
      });
    }
  </script>
</body>
