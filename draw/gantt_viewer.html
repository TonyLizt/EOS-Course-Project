<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Satellite Observation Gantt Chart · EOS</title>
  <script>
    // Also support the existing repository-root http.server /draw/ entry.
    const ganttAssetRoot = location.pathname.startsWith('/visualization/') ? '/static/' : '../eos_system/web/';
    for (const name of ['style.css', 'gantt.css']) {
      const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = ganttAssetRoot + name; document.head.append(link);
    }
    window.addEventListener('DOMContentLoaded', () => {
      for (const name of ['timeline.js', 'gantt.js']) {
        const script = document.createElement('script'); script.async = false; script.src = ganttAssetRoot + name; document.body.append(script);
      }
    });
  </script>
</head>
<body>
  <a class="skip-link" href="#mainArea">跳到时间轴</a>
  <header class="topbar"><div><p class="eyebrow">EOS · SCHEDULE EXPLORER</p><h1>Satellite Observation Gantt Chart</h1><p class="hint">精确 UTC 时间 · 卫星观测任务</p></div><nav aria-label="结果导航"><a href="/">调度控制台</a><a id="cesium-link" hidden>Cesium 回放</a></nav></header>
  <main class="gantt-layout">
    <section class="card" aria-labelledby="controls-heading">
      <h2 id="controls-heading">查找与时间导航</h2>
      <div class="gantt-controls">
        <label>卫星<select id="satellite-filter"><option value="">所有卫星</option></select></label>
        <label>查找任务或卫星<input type="search" id="task-search" placeholder="例如 M009 或 GAOFEN"></label>
        <label>定位观测记录<select id="task-select"><option value="">选择任务，聚焦秒级区间</option></select></label>
      </div>
      <div class="timeline-toolbar" role="group" aria-label="时间窗口操作">
        <button type="button" id="pan-left" class="secondary" aria-label="向前移动半个时间窗口">← 前移</button>
        <button type="button" id="zoom-in">＋ 放大</button><button type="button" id="zoom-out" class="secondary">－ 缩小</button>
        <button type="button" id="fit-all" class="secondary">完整周期</button><button type="button" id="fit-tasks" class="secondary">匹配筛选任务</button>
        <button type="button" id="pan-right" class="secondary" aria-label="向后移动半个时间窗口">后移 →</button>
      </div>
      <div class="gantt-controls range-controls"><label>开始时间 / UTC<input id="range-start" type="datetime-local" step="1"></label><label>结束时间 / UTC<input id="range-end" type="datetime-local" step="1"></label><button id="apply-range" type="button" class="secondary">应用时间范围</button></div>
      <label>在完整周期中移动当前窗口<input id="time-navigator" type="range" min="0" max="1000" step="1" value="0"></label>
      <p id="timeRangeLabel" class="hint" role="status"></p><p id="sourceLabel" class="hint"></p><p id="errorBox" class="error" role="alert" hidden></p>
    </section>
    <section class="card chart-card" aria-label="观测时间轴">
      <p id="chart-status" class="hint" role="status">正在读取正式排程…</p>
      <div id="mainArea" tabindex="0" aria-label="时间轴；加减键缩放，左右方向键移动，Home 恢复完整周期">
        <div class="axis-row"><span class="axis-caption">卫星 / UTC</span><div id="timeAxis"></div></div>
        <div id="ganttScroll"><div id="ganttContainer"></div></div>
      </div>
      <p class="hint chart-tip">鼠标靠近任务条 12 像素内可吸附提示，点击或触摸固定详情；键盘聚焦任务条同样可查看。按 Escape 关闭提示。吸附不改变真实时长，密集位置可选择“定位观测记录”放大到秒级。</p>
    </section>
    <aside class="card" aria-labelledby="task-heading"><div class="inline"><h2 id="task-heading">观测详情</h2><button type="button" id="focus-task" class="secondary" disabled>聚焦此任务</button></div><div id="task-detail">选择观测记录查看卫星、任务与精确时间。</div></aside>
  </main>
  <div id="task-tooltip" role="tooltip" hidden></div>
</body>
</html>
